<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000003">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Drift</title>
<style>
/* ── RESET ───────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#060618 0%,#010108 70%,#000003 100%);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-tap-highlight-color:transparent;color:#fff;
}

/* ── CANVAS ──────────────────────────────────────────────────────────── */
#canvas{position:fixed;inset:0;pointer-events:none;z-index:1}

/* ── TOP NAV ─────────────────────────────────────────────────────────── */
#topnav{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:60;
  background:rgba(1,1,12,0.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(90,122,255,0.07);
  display:flex;align-items:center;justify-content:center;gap:0;
}
.nb{
  background:none;border:none;cursor:pointer;
  width:72px;height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#253060;transition:color 0.25s;
  position:relative;
}
.nb svg{transition:stroke 0.25s}
.nb.active{color:#7a8fff}
.nb.active svg{stroke:#7a8fff}
.nb-dot{
  width:3px;height:3px;border-radius:50%;
  background:#5a7aff;opacity:0;transition:opacity 0.25s;
}
.nb.active .nb-dot{opacity:1}

/* ── SPACE ───────────────────────────────────────────────────────────── */
#space{
  position:fixed;inset:0;top:52px;z-index:2;
  overflow:hidden;touch-action:none;cursor:grab;
}
#space.drag{cursor:grabbing}

/* ── CARDS ───────────────────────────────────────────────────────────── */
.card{
  position:absolute;top:0;left:0;transform-origin:top left;
  width:172px;will-change:transform;
  background:rgba(6,8,26,0.84);
  border:1px solid rgba(80,110,255,0.13);
  border-radius:16px;padding:14px 14px 10px;
  cursor:pointer;user-select:none;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:border-color 0.3s,box-shadow 0.3s;
}
.card:hover{border-color:rgba(90,122,255,0.35);box-shadow:0 0 22px rgba(80,110,255,0.1)}
.card.echo-match{border-color:rgba(100,140,255,0.65);box-shadow:0 0 28px rgba(80,110,255,0.22)}
.cflag{font-size:15px;display:block;margin-bottom:7px;line-height:1}
.ctext{
  font-size:11.5px;line-height:1.55;color:#9aa4c2;display:block;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.cmeta{font-size:10px;color:#2a3560;margin-top:9px;display:flex;gap:10px}

/* ── SPLASH ──────────────────────────────────────────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;background:#000003;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.9s ease;
}
#splash.gone{opacity:0;pointer-events:none}
.sp-glow{
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(80,110,255,0.18) 0%,transparent 70%);
  display:flex;align-items:center;justify-content:center;
  animation:sglow 2s ease-in-out infinite;
}
.sp-star{font-size:34px;color:#5a7aff;animation:spulse 2s ease-in-out infinite}
.sp-name{font-size:20px;letter-spacing:9px;color:#6a7dcc;margin-top:22px;font-weight:300}
.sp-tag{font-size:10px;letter-spacing:3.5px;color:#1e2a50;margin-top:9px;text-transform:uppercase}
@keyframes spulse{0%,100%{opacity:.3;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
@keyframes sglow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}

/* ── EMPTY STATE ─────────────────────────────────────────────────────── */
#emptystate{
  position:fixed;inset:0;top:52px;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.es-star{font-size:22px;color:#1a2540;animation:spulse 3s ease-in-out infinite}
.es-txt{font-size:12px;color:#1a2540;letter-spacing:3px}

/* ── SIDE VIEWS (Saved / My Drifts) ─────────────────────────────────── */
.sview{
  position:fixed;inset:0;top:52px;z-index:40;
  background:rgba(1,1,10,0.98);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:24px 18px 100px;
  opacity:0;pointer-events:none;
  transform:translateY(10px);
  transition:opacity 0.25s ease,transform 0.25s ease;
}
.sview.open{opacity:1;pointer-events:all;transform:translateY(0)}
.sv-head{
  font-size:11px;letter-spacing:5px;color:#2a3560;
  text-transform:uppercase;margin-bottom:22px;
}
.sv-empty{
  text-align:center;padding:60px 20px;
  font-size:12px;color:#1a2540;letter-spacing:2px;line-height:2;
}
.sv-card{
  background:rgba(6,8,26,0.8);
  border:1px solid rgba(80,110,255,0.1);
  border-radius:14px;padding:14px;
  margin-bottom:10px;cursor:pointer;
  transition:border-color 0.2s;
  display:flex;flex-direction:column;gap:7px;
}
.sv-card:active{border-color:rgba(80,110,255,0.35)}
.sv-flag{font-size:16px}
.sv-text{font-size:13px;color:#8894bc;line-height:1.5}
.sv-meta{font-size:10px;color:#253060;display:flex;gap:14px}

/* ── MODAL ───────────────────────────────────────────────────────────── */
#overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,1,14,0.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;align-items:flex-end;justify-content:center;
  padding-bottom:0;
}
#overlay.open{display:flex}
#acard{
  background:rgba(5,7,22,0.98);
  border:1px solid rgba(80,110,255,0.18);
  border-radius:24px 24px 0 0;
  padding:22px 20px 36px;
  width:100%;max-width:440px;
  max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;
}
/* drag handle */
#acard::before{
  content:'';display:block;width:36px;height:4px;
  background:rgba(80,110,255,0.2);border-radius:2px;
  margin:0 auto 18px;
}
#aclose{
  position:absolute;top:18px;right:16px;
  background:rgba(80,110,255,0.08);border:none;
  border-radius:50%;width:30px;height:30px;
  color:#3a4a7a;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s,color 0.2s;
}
#aclose:hover{background:rgba(80,110,255,0.18);color:#7a8fff}
#aflag{font-size:22px;margin-bottom:12px;display:block}
#atext{font-size:15px;line-height:1.7;color:#c0c8e4;margin-bottom:20px}

/* comments */
#acomments{margin-bottom:14px}
.cmt-none{font-size:11px;color:#1e2840;padding:4px 0;letter-spacing:1px}
.cmt-row{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 11px;border-radius:10px;
  background:rgba(80,110,255,0.05);margin-bottom:6px;
}
.cmt-flag{font-size:13px;flex-shrink:0;margin-top:1px}
.cmt-txt{font-size:12px;color:#7a84a8;line-height:1.45}

/* comment form */
#acform{display:flex;gap:8px;margin-bottom:18px}
#acin{
  flex:1;background:rgba(80,110,255,0.06);
  border:1px solid rgba(80,110,255,0.14);border-radius:12px;
  padding:10px 13px;color:#c0c8e4;font-size:13px;outline:none;
  font-family:inherit;
}
#acin::placeholder{color:#2a3460}
#acin:focus{border-color:rgba(80,110,255,0.38)}
#acsend{
  background:rgba(80,110,255,0.14);border:1px solid rgba(80,110,255,0.28);
  border-radius:12px;padding:10px 15px;color:#7a8fff;
  cursor:pointer;font-size:15px;transition:background 0.2s;flex-shrink:0;
}
#acsend:hover{background:rgba(80,110,255,0.26)}

/* action buttons */
#aeacts{display:flex;gap:7px;flex-wrap:wrap}
.abtn{
  flex:1;min-width:56px;
  background:rgba(80,110,255,0.05);
  border:1px solid rgba(80,110,255,0.1);
  border-radius:12px;padding:10px 8px;
  color:#3a4a7a;font-size:11.5px;cursor:pointer;
  text-align:center;letter-spacing:.5px;
  transition:all 0.2s;
}
.abtn:hover{background:rgba(80,110,255,0.14);color:#7a8fff;border-color:rgba(80,110,255,0.28)}
.abtn.on-like{color:#ff7a9a;border-color:rgba(255,100,140,0.28);background:rgba(255,100,140,0.07)}
.abtn.on-save{color:#f5c84a;border-color:rgba(245,200,74,0.28);background:rgba(245,200,74,0.07)}
.abtn.echo-pulse{animation:epulse .4s ease}
@keyframes epulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ── POST INPUT ──────────────────────────────────────────────────────── */
#postarea{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:50;
  width:min(360px,calc(100vw - 32px));
  display:flex;gap:8px;align-items:flex-end;
  background:rgba(3,4,18,0.92);
  border:1px solid rgba(80,110,255,0.18);
  border-radius:18px;padding:9px 9px 9px 14px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 8px 40px rgba(0,0,8,0.6);
}
#tin{
  flex:1;background:none;border:none;outline:none;
  color:#c0c8e4;font-size:14px;resize:none;
  line-height:1.45;max-height:80px;overflow-y:auto;
  font-family:inherit;padding:4px 0;
}
#tin::placeholder{color:#1e2840}
#psend{
  background:rgba(80,110,255,0.18);
  border:1px solid rgba(80,110,255,0.32);
  border-radius:12px;padding:9px 16px;
  color:#7a8fff;cursor:pointer;font-size:12.5px;
  white-space:nowrap;letter-spacing:.8px;
  transition:all 0.2s;flex-shrink:0;
}
#psend:hover{background:rgba(80,110,255,0.3);color:#aabfff}
#psend:disabled{opacity:.35;cursor:not-allowed}

/* ── SCROLLBAR ───────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(80,110,255,0.2);border-radius:2px}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-glow"><div class="sp-star">✦</div></div>
  <div class="sp-name">DRIFT</div>
  <div class="sp-tag">earth's mind · right now</div>
</div>

<!-- TOP NAV -->
<nav id="topnav">

  <!-- Home -->
  <button class="nb active" id="nb-home" onclick="showView('home')" title="Space">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="3" x2="12" y2="9"/>
      <line x1="12" y1="15" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="9" y2="12"/>
      <line x1="15" y1="12" x2="21" y2="12"/>
    </svg>
    <div class="nb-dot"></div>
  </button>

  <!-- Saved -->
  <button class="nb" id="nb-saved" onclick="showView('saved')" title="Saved">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
    <div class="nb-dot"></div>
  </button>

  <!-- My Drifts -->
  <button class="nb" id="nb-mine" onclick="showView('mine')" title="My Drifts">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-3.87 3.58-7 8-7s8 3.13 8 7"/>
    </svg>
    <div class="nb-dot"></div>
  </button>

</nav>

<!-- STAR CANVAS -->
<canvas id="canvas"></canvas>

<!-- FLOATING CARDS -->
<div id="space"></div>

<!-- EMPTY STATE -->
<div id="emptystate" style="display:none">
  <div class="es-star">✦</div>
  <div class="es-txt">be the first to drift tonight</div>
</div>

<!-- SAVED VIEW -->
<div class="sview" id="view-saved">
  <div class="sv-head">✦ &nbsp; Saved</div>
  <div id="saved-list"></div>
</div>

<!-- MY DRIFTS VIEW -->
<div class="sview" id="view-mine">
  <div class="sv-head">◐ &nbsp; My Drifts</div>
  <div id="mine-list"></div>
</div>

<!-- CARD MODAL -->
<div id="overlay">
  <div id="acard">
    <button id="aclose" onclick="closeCard()">✕</button>
    <span id="aflag"></span>
    <div id="atext"></div>
    <div id="acomments"></div>
    <div id="acform">
      <input id="acin" placeholder="echo a thought..." maxlength="200" autocomplete="off">
      <button id="acsend">↑</button>
    </div>
    <div id="aeacts">
      <button class="abtn" id="alike">♡ &nbsp;0</button>
      <button class="abtn" id="asave">✦ &nbsp;save</button>
      <button class="abtn" id="aecho">echo ✦</button>
      <button class="abtn" id="aflagbtn">⚑ &nbsp;report</button>
    </div>
  </div>
</div>

<!-- POST INPUT -->
<div id="postarea">
  <textarea id="tin" placeholder="what are you thinking right now..." maxlength="220" rows="1"></textarea>
  <button id="psend">drift &nbsp;✦</button>
</div>

<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const WORLD  = 3400;
const CARD_W = 172;
const NAV_H  = 52;

// ── STATE ──────────────────────────────────────────────────────────────────
let WW      = window.innerWidth;
let WH      = window.innerHeight - NAV_H;
let cards   = [];
let openI   = null;

let camX = 0, camY = 0;
let velX = 0, velY = 0;
let isDrag = false;
let dsx = 0, dsy = 0, csx = 0, csy = 0;
let lastDx = 0, lastDy = 0;
let ptrDown = false, ptrMoved = false, ptrX = 0, ptrY = 0;

let echoActive = false;
let echoAnchor = {wx:0, wy:0};
let echoScores = {};
let lastPoll   = Date.now();
let pollTimer  = null;

// ── LOCAL STORAGE ──────────────────────────────────────────────────────────
function getSaved(){ return JSON.parse(localStorage.getItem('ds')||'[]'); }
function getMine(){  return JSON.parse(localStorage.getItem('dm')||'[]'); }

function toggleSave(id){
  const s = getSaved(), i = s.indexOf(id);
  i===-1 ? s.push(id) : s.splice(i,1);
  localStorage.setItem('ds', JSON.stringify(s));
  return i===-1;
}
function addMine(id){
  const m = getMine();
  if(!m.includes(id)){ m.push(id); localStorage.setItem('dm', JSON.stringify(m)); }
}
function isSaved(id){ return getSaved().includes(id); }

function getFlag(){
  return localStorage.getItem('dfl') || '🌍';
}

// ── CANVAS / STARS ─────────────────────────────────────────────────────────
const cv  = document.getElementById('canvas');
const ctx = cv.getContext('2d');
let stars = [];

function initStars(){
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  stars = [];
  const n = Math.floor((cv.width * cv.height) / 3800);
  for(let i=0; i<n; i++) stars.push({
    x:  Math.random()*cv.width,
    y:  Math.random()*cv.height,
    r:  0.3 + Math.random()*1.1,
    a:  Math.random(),
    da: (Math.random()-.5)*.0025
  });
}

function drawStars(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const s of stars){
    s.a += s.da;
    if(s.a>1||s.a<.04) s.da*=-1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(140,160,255,${Math.max(.04,Math.min(1,s.a))})`;
    ctx.fill();
  }
}

// ── SPAWN CARD ─────────────────────────────────────────────────────────────
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function spawnCard(d){
  const c = {
    id:    String(d.id),
    flag:  d.flag  || '🌍',
    text:  d.text,
    likes: d.likes || 0,
    wx:   (Math.random()-.5) * WORLD,
    wy:   (Math.random()-.5) * WORLD,
    vx:   (Math.random()-.5) * .22,
    vy:   (Math.random()-.5) * .22,
    z:    .55 + Math.random() * .65,
    el:   null,
    _liked: false
  };

  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    `<span class="cflag">${c.flag}</span>`+
    `<span class="ctext">${esc(c.text)}</span>`+
    `<div class="cmeta"><span>♡ ${c.likes}</span></div>`;

  el.addEventListener('click', ()=>{
    if(ptrMoved) return;
    openCard(cards.indexOf(c));
  });

  document.getElementById('space').appendChild(el);
  c.el = el;
  cards.push(c);
  return c;
}

// ── PHYSICS LOOP ───────────────────────────────────────────────────────────
let raf = null;

function loop(){
  drawStars();

  // Camera inertia
  if(!isDrag){
    camX += velX; camY += velY;
    velX *= .91; velY *= .91;
  }

  for(const c of cards){
    // Drift
    c.wx += c.vx;
    c.wy += c.vy;

    // Echo magnet / repel
    if(echoActive){
      const sc = echoScores[c.id] || 0;
      const dx = echoAnchor.wx - c.wx;
      const dy = echoAnchor.wy - c.wy;
      const d  = Math.hypot(dx,dy) || 1;
      if(sc > .1){
        c.wx += (dx/d)*sc*5;
        c.wy += (dy/d)*sc*5;
      } else {
        c.wx -= (dx/d)*1.4;
        c.wy -= (dy/d)*1.4;
      }
    }

    // World → screen with toroidal wrap
    let sx = c.wx - camX;
    let sy = c.wy - camY;
    while(sx >  WORLD/2) sx -= WORLD;
    while(sx < -WORLD/2) sx += WORLD;
    while(sy >  WORLD/2) sy -= WORLD;
    while(sy < -WORLD/2) sy += WORLD;

    // Translate so 0,0 is screen center → then offset to top-left
    sx = sx + WW/2 - (CARD_W*c.z)/2;
    sy = sy + WH/2 - 38*c.z;

    c.el.style.transform = `translate(${sx}px,${sy}px) scale(${c.z})`;
    c.el.style.opacity   = c.z < .62 ? '.42' : '.92';
    c.el.style.zIndex    = Math.floor(c.z*10);
  }

  raf = requestAnimationFrame(loop);
}

// ── DRAG / PAN ─────────────────────────────────────────────────────────────
const sp = document.getElementById('space');

sp.addEventListener('pointerdown', e=>{
  ptrDown=true; ptrMoved=false;
  ptrX=e.clientX; ptrY=e.clientY;
  isDrag=true; velX=0; velY=0;
  dsx=e.clientX; dsy=e.clientY; csx=camX; csy=camY;
  lastDx=0; lastDy=0;
  sp.classList.add('drag');
  sp.setPointerCapture(e.pointerId);
});

sp.addEventListener('pointermove', e=>{
  if(!ptrDown) return;
  if(Math.hypot(e.clientX-ptrX, e.clientY-ptrY)>5) ptrMoved=true;
  const nx = csx + (dsx - e.clientX);
  const ny = csy + (dsy - e.clientY);
  lastDx = nx - camX;
  lastDy = ny - camY;
  camX = nx; camY = ny;
});

sp.addEventListener('pointerup', ()=>{
  if(!ptrDown) return;
  ptrDown=false; isDrag=false;
  velX = lastDx*.55; velY = lastDy*.55;
  sp.classList.remove('drag');
});
sp.addEventListener('pointercancel', ()=>{
  ptrDown=false; isDrag=false;
  sp.classList.remove('drag');
});

// Stop card click on drag
sp.addEventListener('click', e=>{ if(ptrMoved){ e.stopPropagation(); }}, true);

// ── OPEN CARD MODAL ────────────────────────────────────────────────────────
function openCard(idx){
  if(idx < 0 || idx >= cards.length) return;
  openI = idx;
  const c = cards[idx];

  document.getElementById('aflag').textContent = c.flag;
  document.getElementById('atext').textContent = c.text;

  // Like button
  const lb = document.getElementById('alike');
  lb.textContent = `♡ \u00a0${c.likes}`;
  lb.className = 'abtn' + (c._liked ? ' on-like' : '');

  // Save button
  const sv = document.getElementById('asave');
  sv.textContent = isSaved(c.id) ? '✦ \u00a0saved' : '✦ \u00a0save';
  sv.className = 'abtn' + (isSaved(c.id) ? ' on-save' : '');

  // Comments
  loadComments(c.id);

  document.getElementById('overlay').classList.add('open');
}

function closeCard(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('acomments').innerHTML = '';
  document.getElementById('acin').value = '';
  openI = null;
  echoActive = false; echoScores = {};
  cards.forEach(c=>{
    if(c.el){ c.el.classList.remove('echo-match'); c.el.style.boxShadow=''; }
  });
}

document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target===this) closeCard();
});

// ── COMMENTS ──────────────────────────────────────────────────────────────
async function loadComments(cardId){
  const box = document.getElementById('acomments');
  box.innerHTML = '';
  try{
    const res  = await fetch(`/cards/${cardId}/comments`);
    const data = await res.json();
    if(!data.length){
      box.innerHTML = '<div class="cmt-none">no echoes yet</div>';
      return;
    }
    box.innerHTML = data.map(cm=>
      `<div class="cmt-row">
        <span class="cmt-flag">${cm.flag}</span>
        <span class="cmt-txt">${esc(cm.text)}</span>
      </div>`
    ).join('');
  } catch(e){ box.innerHTML=''; }
}

document.getElementById('acsend').addEventListener('click', async ()=>{
  if(openI===null) return;
  const c   = cards[openI];
  const txt = document.getElementById('acin').value.trim();
  if(!txt) return;
  try{
    const r = await fetch(`/cards/${c.id}/comments`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text:txt, flag:getFlag()})
    });
    if(r.ok){ document.getElementById('acin').value=''; loadComments(c.id); }
  } catch(e){}
});

document.getElementById('acin').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('acsend').click(); }
});

// ── LIKE ──────────────────────────────────────────────────────────────────
document.getElementById('alike').addEventListener('click', async ()=>{
  if(openI===null) return;
  const c = cards[openI];
  if(c._liked) return;
  try{
    const r    = await fetch(`/cards/${c.id}/like`,{method:'POST'});
    const data = await r.json();
    c.likes = data.likes; c._liked = true;
    if(c.el) c.el.querySelector('.cmeta').textContent = `♡ ${c.likes}`;
    const lb = document.getElementById('alike');
    lb.textContent = `♡ \u00a0${c.likes}`;
    lb.className = 'abtn on-like';
  } catch(e){}
});

// ── SAVE ──────────────────────────────────────────────────────────────────
document.getElementById('asave').addEventListener('click', ()=>{
  if(openI===null) return;
  const c = cards[openI];
  const now = toggleSave(c.id);
  const sv = document.getElementById('asave');
  sv.textContent = now ? '✦ \u00a0saved' : '✦ \u00a0save';
  sv.className = 'abtn' + (now ? ' on-save' : '');
});

// ── ECHO ──────────────────────────────────────────────────────────────────
document.getElementById('aecho').addEventListener('click', async ()=>{
  if(openI===null) return;
  const c = cards[openI];
  echoAnchor = {wx:c.wx, wy:c.wy};
  closeCard();
  if(c.el) c.el.style.boxShadow = '0 0 44px rgba(90,130,255,0.9)';

  try{
    const r = await fetch('/echo',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text:c.text})
    });
    const similar = await r.json();
    echoScores = {};
    similar.forEach(s=>{
      echoScores[s.id] = s.score;
      const mc = cards.find(x=>x.id===s.id);
      if(mc&&mc.el) mc.el.classList.add('echo-match');
    });
    echoActive = true;
    setTimeout(()=>{
      echoActive = false; echoScores = {};
      if(c.el) c.el.style.boxShadow = '';
      cards.forEach(x=>{ if(x.el) x.el.classList.remove('echo-match'); });
    }, 7000);
  } catch(e){ echoActive=false; }
});

// ── FLAG / REPORT ─────────────────────────────────────────────────────────
document.getElementById('aflagbtn').addEventListener('click', async ()=>{
  if(openI===null) return;
  const c = cards[openI];
  if(!confirm('Report this card?')) return;
  try{
    await fetch('/flag',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:c.id, reason:'user report'})
    });
    closeCard();
  } catch(e){}
});

// ── POST DRIFT ────────────────────────────────────────────────────────────
const tin  = document.getElementById('tin');
const psnd = document.getElementById('psend');

tin.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80)+'px';
});
tin.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); postDrift(); }
});
psnd.addEventListener('click', postDrift);

async function postDrift(){
  const text = tin.value.trim();
  if(!text) return;
  psnd.disabled = true;
  try{
    const r = await fetch('/cards',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, flag:getFlag()})
    });
    if(r.ok){
      const d = await r.json();
      tin.value = ''; tin.style.height = 'auto';
      const c = spawnCard(d);
      camX = c.wx; camY = c.wy; // center on new card
      addMine(String(d.id));
      document.getElementById('emptystate').style.display = 'none';
    } else {
      const e = await r.json();
      alert(e.error || 'could not post');
    }
  } catch(e){ alert('connection error'); }
  finally{ psnd.disabled=false; }
}

// ── LOAD CARDS ────────────────────────────────────────────────────────────
async function loadRealCards(){
  try{
    const r    = await fetch('/cards');
    const data = await r.json();
    data.forEach(spawnCard);
    if(!data.length){
      document.getElementById('emptystate').style.display = 'flex';
    }
  } catch(e){ console.error('load:', e); }
  finally{ hideSplash(); }
}

// ── REAL-TIME POLLING ──────────────────────────────────────────────────────
async function pollNewCards(){
  const t = Date.now();
  try{
    const r    = await fetch(`/cards/new?since=${lastPoll}`);
    const data = await r.json();
    data.forEach(d=>{
      if(!cards.find(c=>c.id===String(d.id))){
        spawnCard(d);
        document.getElementById('emptystate').style.display = 'none';
      }
    });
  } catch(e){}
  finally{ lastPoll = t; }
}

// ── VIEWS ─────────────────────────────────────────────────────────────────
function showView(name){
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-'+name).classList.add('active');
  document.getElementById('postarea').style.display = name==='home' ? 'flex' : 'none';
  document.getElementById('view-saved').classList.toggle('open', name==='saved');
  document.getElementById('view-mine').classList.toggle('open',  name==='mine');
  if(name==='saved') loadSavedView();
  if(name==='mine')  loadMineView();
}

async function fetchBatch(ids){
  if(!ids.length) return [];
  const r = await fetch(`/cards/batch?ids=${ids.join(',')}`);
  return r.ok ? r.json() : [];
}

function renderSvCards(data, container){
  if(!data.length){
    container.innerHTML = `<div class="sv-empty">nothing here yet<br>◦ ◦ ◦</div>`;
    return;
  }
  container.innerHTML = data.map(d=>`
    <div class="sv-card" onclick="jumpToCard('${d.id}')">
      <span class="sv-flag">${d.flag}</span>
      <div class="sv-text">${esc(d.text)}</div>
      <div class="sv-meta"><span>♡ ${d.likes||0}</span></div>
    </div>`
  ).join('');
}

async function loadSavedView(){
  const box = document.getElementById('saved-list');
  box.innerHTML = '<div style="color:#1e2840;font-size:12px;padding:8px 0">loading...</div>';
  try{ renderSvCards(await fetchBatch(getSaved()), box); }
  catch(e){ box.innerHTML='<div class="sv-empty">could not load</div>'; }
}

async function loadMineView(){
  const box = document.getElementById('mine-list');
  box.innerHTML = '<div style="color:#1e2840;font-size:12px;padding:8px 0">loading...</div>';
  try{ renderSvCards(await fetchBatch(getMine()), box); }
  catch(e){ box.innerHTML='<div class="sv-empty">could not load</div>'; }
}

function jumpToCard(id){
  showView('home');
  const idx = cards.findIndex(c=>c.id===String(id));
  if(idx!==-1){
    camX = cards[idx].wx;
    camY = cards[idx].wy;
    setTimeout(()=>openCard(idx), 250);
  }
}

// ── SPLASH ────────────────────────────────────────────────────────────────
function hideSplash(){
  const el = document.getElementById('splash');
  if(!el) return;
  el.classList.add('gone');
  setTimeout(()=>el.remove(), 950);
}

// ── FLAG AUTO-DETECT ──────────────────────────────────────────────────────
async function detectFlag(){
  if(localStorage.getItem('dfl')) return;
  try{
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    if(d.country_flag_emoji) localStorage.setItem('dfl', d.country_flag_emoji);
  } catch(e){}
}

// ── RESIZE ────────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  WW = window.innerWidth;
  WH = window.innerHeight - NAV_H;
  initStars();
});

// ── INIT ──────────────────────────────────────────────────────────────────
(async ()=>{
  initStars();
  loop();
  setTimeout(hideSplash, 3500); // fallback if server slow
  detectFlag();
  await loadRealCards();
  pollTimer = setInterval(pollNewCards, 10000);
})();
</script>
</body>
