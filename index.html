<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Drift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#060618 0%,#010108 70%,#000003 100%);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#canvas{position:absolute;inset:0;pointer-events:none;z-index:1}
#space{position:absolute;inset:0;z-index:2;overflow:hidden;touch-action:none;cursor:grab}
#space.drag{cursor:grabbing}
.card{
  position:absolute;top:0;left:0;
  transform-origin:top left;
  width:185px;border-radius:14px;
  padding:10px 12px 9px;
  background:rgba(5,8,25,0.88);
  border:1px solid rgba(70,100,255,0.18);
  box-shadow:0 0 18px rgba(40,70,255,0.07),0 2px 12px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.04);
  user-select:none;will-change:transform,opacity;cursor:pointer;
}
.crow{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.cflag{font-size:14px}
.cid{font-size:9px;font-family:monospace;letter-spacing:1.5px;color:rgba(90,118,255,0.4)}
.ctxt{font-size:12.5px;color:rgba(210,222,255,0.88);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdots{font-size:10px;color:rgba(90,118,255,0.3);margin-top:2px;letter-spacing:2px}
.cfoot{margin-top:7px;display:flex;gap:10px;font-size:9.5px;color:rgba(80,112,255,0.28)}
#ov{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(0,0,8,0.74);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
#ov.on{display:block}
#exp{
  display:none;position:fixed;z-index:100;
  width:min(305px,90vw);
  background:rgba(5,8,24,0.98);
  border:1px solid rgba(90,130,255,0.38);
  border-radius:18px;
  box-shadow:0 0 90px rgba(50,85,255,0.2),0 14px 55px rgba(0,0,0,0.85),inset 0 1px 0 rgba(255,255,255,0.05);
  opacity:0;transform:scale(0.86);
  transition:opacity .38s ease,transform .42s cubic-bezier(.16,1,.3,1);
}
#exp.on{display:block}
#exp.show{opacity:1;transform:scale(1)}
.eh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
  border-bottom:1px solid rgba(70,100,255,0.1)}
.emeta{display:flex;align-items:center;gap:6px}
.eflag{font-size:18px}.eid{font-size:9px;font-family:monospace;letter-spacing:1.5px;color:rgba(90,118,255,0.44)}
.ex{font-size:15px;color:rgba(100,130,255,0.36);cursor:pointer;padding:2px 6px}
.ebody{padding:12px 16px;max-height:130px;overflow-y:auto;
  font-size:13.5px;color:rgba(215,225,255,0.9);line-height:1.68}
.eacts{display:flex;gap:8px;align-items:center;padding:10px 16px;
  border-top:1px solid rgba(70,100,255,0.1)}
.abtn{display:flex;align-items:center;gap:4px;border-radius:18px;padding:6px 12px;
  font-size:12px;cursor:pointer;border:1px solid rgba(70,100,255,0.18);
  background:rgba(70,100,255,0.07);color:rgba(135,158,255,0.48);font-family:inherit}
.abtn.liked{background:rgba(255,60,100,0.14);border-color:rgba(255,70,110,0.38);color:rgba(255,90,130,0.95)}
.abtn.saved{background:rgba(255,195,50,0.12);border-color:rgba(255,200,55,0.38);color:rgba(255,206,68,0.95)}
.csec{border-top:1px solid rgba(70,100,255,0.1)}
.clist{max-height:115px;overflow-y:auto;padding:8px 16px}
.citem{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid rgba(70,100,255,0.06)}
.citem:last-child{border-bottom:none}
.citflag{font-size:12px;flex-shrink:0;margin-top:1px}
.cittxt{font-size:11.5px;color:rgba(200,215,255,0.72);line-height:1.5}
.cempty{padding:10px 16px;font-size:11px;color:rgba(90,118,255,0.28);text-align:center}
.cbar{display:flex;gap:8px;align-items:center;padding:10px 16px 14px}
.cin{flex:1;background:rgba(4,7,22,0.9);border:1px solid rgba(70,100,255,0.15);
  border-radius:18px;padding:8px 14px;font-size:12px;color:rgba(210,222,255,0.9);
  outline:none;font-family:inherit}
.cin::placeholder{color:rgba(90,118,255,0.26)}
.csend{background:rgba(50,75,255,0.18);border:1px solid rgba(70,100,255,0.26);
  border-radius:50%;width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:rgba(130,155,255,0.7);font-size:16px;cursor:pointer}
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:60;pointer-events:none;
  padding:18px 18px 34px;
  background:linear-gradient(to bottom,rgba(0,0,5,.94),transparent);
  display:flex;align-items:center;justify-content:space-between;
}
.hl{font-size:9px;letter-spacing:5.5px;text-transform:uppercase;color:rgba(108,138,255,.42);margin-bottom:3px}
.hs{font-size:10px;color:rgba(88,118,255,.26);letter-spacing:.8px}
.hli{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(108,138,255,.35)}
.hdot{width:5px;height:5px;border-radius:50%;background:#4ade80;box-shadow:0 0 7px rgba(74,222,128,.9);display:inline-block}
#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  padding:16px 14px 24px;
  background:linear-gradient(to top,rgba(0,0,5,.97) 0%,rgba(0,0,5,.5) 65%,transparent);
  display:flex;gap:8px;align-items:center;
}
#tin{flex:1;background:rgba(4,7,22,.92);border:1px solid rgba(70,100,255,.15);
  border-radius:22px;padding:11px 16px;font-size:12px;color:rgba(210,222,255,.9);
  outline:none;font-family:inherit}
#tin::placeholder{color:rgba(98,130,255,.28)}
#tin:focus{border-color:rgba(70,100,255,.38)}
#dbt{background:rgba(45,65,255,.15);border:1px solid rgba(70,100,255,.25);
  border-radius:22px;padding:11px 14px;font-size:12px;
  color:rgba(128,154,255,.68);cursor:pointer;white-space:nowrap;font-family:inherit}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="space"></div>
<div id="ov"></div>

<div id="exp">
  <div class="eh">
    <div class="emeta"><span class="eflag" id="ef"></span><span class="eid" id="eid"></span></div>
    <span class="ex" id="exc">✕</span>
  </div>
  <div class="ebody" id="etxt"></div>
  <div class="eacts">
    <button class="abtn" id="elk">♡ 0</button>
    <button class="abtn" id="ecm">💬 0</button>
    <button class="abtn" style="margin-left:auto">echo ✦</button>
  </div>
  <div class="csec">
    <div class="clist" id="clist"></div>
    <div class="cbar">
      <input class="cin" id="cin" placeholder="add a comment…" maxlength="160"/>
      <button class="csend" id="csend">›</button>
    </div>
  </div>
</div>

<div id="hdr">
  <div><div class="hl">✦ &nbsp;drift</div><div class="hs">earth's mind · right now</div></div>
  <div class="hli"><span class="hdot"></span>3 241 drifting</div>
</div>
<div id="bar">
  <input id="tin" type="text" placeholder="what's on your mind…" maxlength="220"/>
  <button id="dbt">✦ drift</button>
</div>

<script>
const vw=()=>window.innerWidth, vh=()=>window.innerHeight;

// Canvas is 2400×2100 — compact for noticeable toroidal loop
const WW=2400, WH=2100, CW=185;

const BASE=[
  // ── ORIGINAL 15 ──────────────────────────────────────────────────────────────
  {flag:"🇦🇷",id:"1809",text:"anyone here? I can't sleep. 3am and the city is quiet but my brain won't stop running.",likes:34,comments:[{flag:"🇺🇸",text:"3am is the loudest hour, you're not alone"},{flag:"🇯🇵",text:"i feel this every single night"}]},
  {flag:"🇺🇸",id:"2241",text:"3am and my mind won't stop. lying here for 2 hours thinking about everything I said wrong today.",likes:67,comments:[{flag:"🇩🇿",text:"overthinking at night is its own kind of torture"}]},
  {flag:"🇯🇵",id:"0847",text:"i feel like a stranger here. surrounded by people i grew up with. is this normal?",likes:21,comments:[]},
  {flag:"🇩🇿",id:"3301",text:"i built something today. small thing. proof i'm still moving even when it doesn't show.",likes:45,comments:[{flag:"🇧🇷",text:"this is the energy ✦"},{flag:"🇰🇷",text:"keep going"}]},
  {flag:"🇧🇷",id:"1122",text:"nobody knows the real me. the version they see is edited. what if i showed the raw one.",likes:89,comments:[]},
  {flag:"🇨🇳",id:"4401",text:"i miss who i used to be. not the life, just the version of me that believed things work out.",likes:112,comments:[{flag:"🇫🇷",text:"that version is still in there"}]},
  {flag:"🇬🇧",id:"0033",text:"why is silence so loud. turned everything off and now all i hear is what i've been avoiding.",likes:28,comments:[]},
  {flag:"🇮🇳",id:"2987",text:"chasing something i can't name. not money not fame. something that feels like it matters.",likes:53,comments:[{flag:"🇩🇪",text:"i think the looking is the point"}]},
  {flag:"🇩🇪",id:"1567",text:"some days feel borrowed. like i'm in someone else's timeline and my real life is still buffering.",likes:17,comments:[]},
  {flag:"🇰🇷",id:"0921",text:"still waiting for something. a sign a shift. maybe i am the sign i've been waiting for.",likes:76,comments:[{flag:"🇸🇦",text:"you are the sign. trust it."}]},
  {flag:"🇫🇷",id:"3344",text:"do you ever feel invisible. not lonely. just like you could disappear and the world keeps moving fine.",likes:41,comments:[]},
  {flag:"🇲🇽",id:"1100",text:"i laughed today, finally. real laugh. the kind that makes your stomach hurt. forgot what that felt like.",likes:94,comments:[{flag:"🇦🇷",text:"this made me smile ♡"}]},
  {flag:"🇹🇷",id:"5512",text:"my family doesn't know the life i live in my head. real conversations only when everyone's asleep.",likes:38,comments:[]},
  {flag:"🇿🇦",id:"7731",text:"i keep starting things and not finishing. not lazy. scared of what finishing actually means.",likes:62,comments:[{flag:"🇺🇸",text:"finishing means it can be judged. i understand."}]},
  {flag:"🇸🇦",id:"9902",text:"sometimes i just need someone to tell me i'm doing okay. not great. just okay is enough tonight.",likes:55,comments:[{flag:"🇯🇵",text:"you're doing okay ♡"},{flag:"🇩🇿",text:"more than okay, believe it"}]},
  // ── MIDNIGHT CONFESSIONS ──────────────────────────────────────────────────────
  {flag:"🇮🇩",id:"4421",text:"blocked him. still open his profile from a different account every night. this is not healing.",likes:143,comments:[{flag:"🇧🇷",text:"we've all been there. the pull is real."},{flag:"🇺🇸",text:"that alternate account deserves a medal and therapy"}]},
  {flag:"🇳🇬",id:"3317",text:"told everyone i was fine and cried in the parking lot for 25 minutes before driving home.",likes:88,comments:[{flag:"🇫🇷",text:"the parking lot is the real therapy space"},{flag:"🇮🇳",text:"this hit me somewhere real"}]},
  {flag:"🇪🇸",id:"2208",text:"consciousness is just the universe staring at itself and wondering why it did that.",likes:77,comments:[{flag:"🇯🇵",text:"rocks have it figured out honestly"}]},
  {flag:"🇵🇹",id:"1134",text:"i've been 'almost there' for 3 years. at what point do i admit almost is where i live now.",likes:201,comments:[{flag:"🇩🇿",text:"almost is momentum. don't stop."},{flag:"🇰🇷",text:"'almost there' means you're still moving"}]},
  {flag:"🇨🇦",id:"7788",text:"hustle culture was invented by people who had no personality and mistook output for identity.",likes:445,comments:[{flag:"🇺🇸",text:"real. the grind is the void."},{flag:"🇬🇧",text:"sending this to my boss"},{flag:"🇧🇷",text:"💀💀"}]},
  {flag:"🇦🇺",id:"9943",text:"therapist asked me to describe my support system. i said 'i have a really good playlist'.",likes:671,comments:[{flag:"🇩🇪",text:"the playlist understands me better than most humans"},{flag:"🇫🇷",text:"lmaooo but also 😭"}]},
  {flag:"🇳🇱",id:"5587",text:"the version of me that exists in other people's memories is a stranger i don't recognize.",likes:93,comments:[]},
  {flag:"🇵🇱",id:"4412",text:"i've optimized my sadness. it runs in the background now. very efficient. barely notice it.",likes:388,comments:[{flag:"🇺🇸",text:"background process sadness is the real adult experience"},{flag:"🇮🇳",text:"this is disturbingly relatable"}]},
  {flag:"🇸🇪",id:"3398",text:"why does every motivational quote feel like it was written by someone who never actually struggled.",likes:529,comments:[{flag:"🇦🇷",text:"because it probably was"},{flag:"🇨🇳",text:"'just believe' said the person with a trust fund"}]},
  {flag:"🇨🇭",id:"8821",text:"she loved me more than i knew how to handle. i left because i was afraid of being truly seen.",likes:178,comments:[{flag:"🇧🇷",text:"this one hurt"},{flag:"🇫🇷",text:"at least you can see it now"}]},
  // ── TOXIC ANONYMOUS ──────────────────────────────────────────────────────────
  {flag:"🇧🇪",id:"2265",text:"hot take: most people are not interesting, they're just available. and we confuse the two.",likes:617,comments:[{flag:"🇬🇧",text:"...okay this is actually accurate"},{flag:"🇺🇸",text:"i need to sit with this one"}]},
  {flag:"🇦🇹",id:"1178",text:"the system rewards confidence over competence every single time and we all just accept this.",likes:834,comments:[{flag:"🇮🇳",text:"my entire career confirmed"},{flag:"🇯🇵",text:"confident idiot beats quiet genius, in every room"}]},
  {flag:"🇬🇷",id:"6634",text:"what if the version of me i'm trying to become is just as lost as the one i am now.",likes:67,comments:[{flag:"🇸🇦",text:"this is the question that breaks you and fixes you simultaneously"}]},
  {flag:"🇮🇱",id:"8801",text:"everyone's performing okayness. i'm performing okayness. we're all performing okayness together.",likes:912,comments:[{flag:"🇺🇸",text:"the okayness performance is exhausting"},{flag:"🇫🇷",text:"can we all agree to stop"},{flag:"🇦🇷",text:"not until someone goes first"}]},
  {flag:"🇸🇬",id:"5523",text:"real question: how many fake arguments do you replay daily with people who don't know you're fighting.",likes:1204,comments:[{flag:"🇮🇳",text:"currently 4 active unfinished ones"},{flag:"🇺🇸",text:"i always win those btw"},{flag:"🇬🇧",text:"and i deliver the perfect speech every time 💀"}]},
  {flag:"🇳🇿",id:"3371",text:"i think i've been waiting for permission to live my life. from someone who doesn't exist.",likes:256,comments:[{flag:"🇰🇷",text:"this woke something up in me"}]},
  {flag:"🇲🇾",id:"9965",text:"stop glorifying being broke. it's survival mode, not an aesthetic.",likes:443,comments:[{flag:"🇧🇷",text:"💯"},{flag:"🇿🇦",text:"the romanticization needs to end"},{flag:"🇺🇸",text:"struggling is not a personality trait"}]},
  {flag:"🇵🇭",id:"1198",text:"friendship is just recurring coincidences that eventually you stop allowing to happen.",likes:187,comments:[{flag:"🇲🇽",text:"this is the saddest true thing"},{flag:"🇫🇷",text:"i felt this in my chest"}]},
  {flag:"🇺🇦",id:"7723",text:"we're all NPCs in someone else's main quest and they barely notice us in their dialogue.",likes:892,comments:[{flag:"🇺🇸",text:"i am SO skippable"},{flag:"🇯🇵",text:"hoping i'm at least a memorable side character"}]},
  {flag:"🇨🇿",id:"4456",text:"my entire personality is just trauma responses i learned to make look like quirks.",likes:1567,comments:[{flag:"🇩🇪",text:"therapy in one sentence"},{flag:"🇮🇳",text:"the audacity to be THIS correct"},{flag:"🇺🇸",text:"pinning this to my brain"}]},
  // ── HEARTBREAK & LOSS ─────────────────────────────────────────────────────────
  {flag:"🇭🇺",id:"5589",text:"i don't miss them. i miss the version of me that existed when they were around.",likes:2103,comments:[{flag:"🇫🇷",text:"this is the actual truth they don't tell you about heartbreak"},{flag:"🇧🇷",text:"😭 been sitting with this for 5 minutes"}]},
  {flag:"🇷🇴",id:"3342",text:"the most dangerous thing about loneliness is it starts to feel like your natural state.",likes:445,comments:[{flag:"🇸🇦",text:"it creeps in until you forget what the alternative feels like"},{flag:"🇰🇷",text:"reach out to someone tonight. seriously."}]},
  {flag:"🇸🇰",id:"2287",text:"'if you need therapy you need discipline.' said by someone who desperately needs both.",likes:1832,comments:[{flag:"🇺🇸",text:"💀💀💀"},{flag:"🇬🇧",text:"it's giving 'i eat rocks for breakfast'"},{flag:"🇮🇳",text:"self-awareness: zero"}]},
  {flag:"🇭🇷",id:"8834",text:"sometimes i write things in my notes app too honest to post anywhere. this was one of them.",likes:334,comments:[{flag:"🇩🇿",text:"brave."},{flag:"🇫🇷",text:"the notes app is the realest social media"}]},
  {flag:"🇧🇬",id:"1154",text:"i am one conversation away from changing my entire trajectory. just terrified to start it.",likes:289,comments:[{flag:"🇺🇸",text:"send the message. the fear doesn't go away. do it scared."}]},
  {flag:"🇱🇹",id:"6678",text:"modern loneliness: surrounded by people who'd react to your death online but wouldn't call you today.",likes:2891,comments:[{flag:"🇬🇧",text:"most disturbing true thing posted this week"},{flag:"🇦🇷",text:"read this and immediately texted someone"},{flag:"🇯🇵",text:"check on your actual people. not their stories. THEM."}]},
  {flag:"🇱🇻",id:"4498",text:"the scariest part of therapy is discovering you are both the wound and the one doing the hurting.",likes:678,comments:[{flag:"🇩🇪",text:"took me 2 years and $4000 to understand this sentence"},{flag:"🇮🇳",text:"reading this was free and equally painful"}]},
  {flag:"🇪🇪",id:"2276",text:"great life on paper. feel absolutely nothing most of the time. what's that called.",likes:1122,comments:[{flag:"🇺🇸",text:"high-functioning emptiness. it's a thing."},{flag:"🇫🇷",text:"anhedonia. and you're not alone."},{flag:"🇧🇷",text:"the paper version doesn't feel anything because it's paper"}]},
  {flag:"🇲🇹",id:"9901",text:"my biggest fear isn't failure. it's building everything i want and still feeling empty.",likes:877,comments:[{flag:"🇸🇦",text:"the most under-discussed fear"},{flag:"🇩🇿",text:"it scares me every single day"}]},
  {flag:"🇨🇾",id:"3365",text:"people who ghost you are just doing you a favor badly. the message is the same, they're just cowards.",likes:1003,comments:[{flag:"🇺🇸",text:"simultaneously correct and unsatisfying"},{flag:"🇰🇷",text:"the coward part is the part that lingers"}]},
  // ── DARK HUMOR / ABSURD ───────────────────────────────────────────────────────
  {flag:"🇮🇸",id:"7756",text:"this app is what it looks like when you can see everyone's 2am thoughts at once. it's a lot.",likes:556,comments:[{flag:"🇬🇧",text:"somehow less terrifying than expected"},{flag:"🇯🇵",text:"the realness here is kind of beautiful"}]},
  {flag:"🇱🇺",id:"5534",text:"told i was 'too much' so many times i started performing 'just enough.' nobody noticed the difference.",likes:1445,comments:[{flag:"🇫🇷",text:"'too much' means too much for someone who wasn't enough"},{flag:"🇦🇷",text:"whoever told you that was wrong. be the whole thing."}]},
  {flag:"🇲🇨",id:"8867",text:"why do we say we're fine. it takes 2 seconds, we all know it's a lie, and we all accept it anyway.",likes:2234,comments:[{flag:"🇩🇪",text:"social contract holding civilization by one thread"},{flag:"🇺🇸",text:"'fine' is load-bearing"},{flag:"🇧🇷",text:"if everyone stopped saying fine, society collapses"}]},
  {flag:"🇸🇲",id:"1143",text:"the most radical thing you can do right now is rest without performing productivity while you do it.",likes:678,comments:[{flag:"🇬🇧",text:"radical rest is real"},{flag:"🇮🇳",text:"tell this to my parents"}]},
  {flag:"🇻🇦",id:"4487",text:"some people developed sarcasm as a defense mechanism so strong they can't turn it off anymore.",likes:1789,comments:[{flag:"🇺🇸",text:"i can't tell if this is a compliment or a diagnosis"},{flag:"🇩🇿",text:"it's both and it applies to me specifically"},{flag:"🇫🇷",text:"the ironic detachment is structural at this point"}]},
  {flag:"🇩🇰",id:"2291",text:"i love my friends but i cancel plans at an 87% rate. i don't know how they still invite me.",likes:3401,comments:[{flag:"🇩🇪",text:"the 13% is enough for us"},{flag:"🇺🇸",text:"fellow cancelers we must unionize"},{flag:"🇯🇵",text:"they invite you because they love the possibility of you showing up"}]},
  {flag:"🇫🇮",id:"6623",text:"finnish silence is deep communication. i can see how outsiders find it horrifying though.",likes:412,comments:[{flag:"🇸🇪",text:"same in sweden. silence = i respect you."},{flag:"🇺🇸",text:"i was in helsinki 3 days and thought everyone hated me"}]},
  {flag:"🇳🇴",id:"3387",text:"people who post most about gratitude are statistically the most desperately unhappy. no source. feels true.",likes:678,comments:[{flag:"🇬🇧",text:"no source but feel deeply true"},{flag:"🇦🇷",text:"the louder the gratitude, the bigger the void"}]},
  {flag:"🇮🇪",id:"8845",text:"i'm not antisocial. i'm just very good at calculating the energy cost of every interaction.",likes:1901,comments:[{flag:"🇮🇳",text:"introversion with an economics degree"},{flag:"🇩🇿",text:"this is the most relatable thing i've read all week"}]},
  // ── SOCIETY & CAPITALISM ──────────────────────────────────────────────────────
  {flag:"🇵🇹",id:"5578",text:"the saddest thing in the world is a smart person who stopped believing in themselves years ago.",likes:1234,comments:[{flag:"🇺🇸",text:"the potential just sitting there untouched kills me"},{flag:"🇧🇷",text:"are you talking about me specifically"}]},

// ── GRID: 10 cols, canvas 2400×2100 → cell ~220px wide, ~158px tall
// Gaps: ~35px horizontal, ~43px vertical — compact feel
const COLS=10, ROWS=Math.ceil(BASE.length/COLS);
const gcw=(WW-200)/COLS, gch=(WH-200)/ROWS;

const cards=BASE.map((t,i)=>{
  const col=i%COLS, row=Math.floor(i/COLS);
  const jx=((i*137+41)%100)/100, jy=((i*97+23)%100)/100;
  const ang=((i*61)%628)/100;
  const spd=0.042+((i*17)%12)/300;
  return{
    ...t, liked:false, saved:false, comments:[...t.comments],
    wx: 80+col*gcw+jx*Math.max(0,gcw-CW-20),
    wy: 80+row*gch+jy*Math.max(0,gch-130),
    vx: Math.cos(ang)*spd,
    vy: Math.sin(ang)*spd,
    // Phase in radians, evenly spread 0→2π so all cycle stages are visible at start
    phase: (i/BASE.length)*Math.PI*2,
    // ~0.0013–0.0019 rad/frame → 55–80 sec full oscillation cycle @ 60fps
    phaseSpd: 0.0013+((i*7)%8)*0.000075,
    el:null, sx:0, sy:0,
  };
});

let cam={x:WW/2-vw()/2, y:WH/2-vh()/2};
let vel={x:0,y:0};
const FRICTION=0.984;
let openI=null;

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let stars=[];
function initCanvas(){
  const d=window.devicePixelRatio||1;
  canvas.width=vw()*d; canvas.height=vh()*d;
  canvas.style.width=vw()+'px'; canvas.style.height=vh()+'px';
  ctx.scale(d,d);
}
function initStars(){
  stars=Array.from({length:320},()=>{
    const t=Math.random()<.55?0:Math.random()<.7?1:2;
    return{
      sx:Math.random()*vw(), sy:Math.random()*vh(),
      r:[.26,.60,1.05][t],
      par:[.06,.10,.15][t],
      ba:[.12,.36,.64][t]*(0.5+Math.random()*.5),
      ph:Math.random()*Math.PI*2, ps:.004+Math.random()*.01,
      dx:(Math.random()-.5)*.025, dy:(Math.random()-.5)*.025,
    };
  });
}

const space=document.getElementById('space');
function mkHtml(c){
  return`<div class="crow">
    <span class="cflag">${c.flag}</span>
    <span class="cid">#${c.id}</span>
  </div>
  <div class="ctxt">${c.text}</div>
  ${c.text.length>55?'<div class="cdots">···</div>':''}
  <div class="cfoot">
    <span>♡ ${c.likes}</span>
    ${c.comments.length?`<span>💬 ${c.comments.length}</span>`:''}
    <span style="margin-left:auto;color:rgba(70,105,255,.14)">tap</span>
  </div>`;
}
cards.forEach(c=>{

  el.className='card'; el.innerHTML=mkHtml(c);
  space.appendChild(el); c.el=el;
});

const ov=document.getElementById('ov');
const exp=document.getElementById('exp');
const FLAGS_ALL=['🇩🇿','🇺🇸','🇫🇷','🇬🇧','🇧🇷','🇯🇵','🇮🇳','🇩🇪','🇰🇷','🇲🇽','🇨🇳','🇹🇷','🇸🇦','🇿🇦','🇦🇷'];

function rdrComments(i){
  const c=cards[i], el=document.getElementById('clist');
  el.innerHTML=c.comments.length
    ? c.comments.map(x=>`<div class="citem"><span class="citflag">${x.flag}</span><span class="cittxt">${x.text}</span></div>`).join('')
    : '<div class="cempty">no comments yet</div>';
  el.scrollTop=el.scrollHeight;
}
function openCard(i){
  if(openI!==null)return;
  openI=i;
  const c=cards[i];
  document.getElementById('ef').textContent=c.flag;
  document.getElementById('eid').textContent='#'+c.id;
  document.getElementById('etxt').textContent=c.text;
  const lb=document.getElementById('elk');
  lb.className='abtn'+(c.liked?' liked':'');
  lb.textContent=(c.liked?'♥ ':'♡ ')+c.likes;
  document.getElementById('ecm').textContent='💬 '+c.comments.length;
  document.getElementById('cin').value='';
  rdrComments(i);
  const ew=Math.min(305,vw()*.9), eh=Math.min(460,vh()*.84);
  exp.style.cssText+=`;left:${(vw()-ew)/2}px;top:${(vh()-eh)/2}px;width:${ew}px;max-height:${eh}px;overflow-y:auto`;
  exp.classList.add('on');
  ov.classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>exp.classList.add('show')));
}
function closeCard(){
  exp.classList.remove('show');
  ov.classList.remove('on');
  setTimeout(()=>{exp.classList.remove('on');openI=null;},340);
}
document.getElementById('exc').addEventListener('click',closeCard);
ov.addEventListener('click',closeCard);
document.getElementById('elk').addEventListener('click',()=>{
  if(openI===null)return;
  const c=cards[openI]; c.liked=!c.liked; c.likes+=c.liked?1:-1;
  const lb=document.getElementById('elk');
  lb.className='abtn'+(c.liked?' liked':'');
  lb.textContent=(c.liked?'♥ ':'♡ ')+c.likes;
  if(c.el)c.el.innerHTML=mkHtml(c);
});
function addComment(){
  if(openI===null)return;
  const inp=document.getElementById('cin'), txt=inp.value.trim();
  if(!txt)return;
  cards[openI].comments.push({flag:FLAGS_ALL[Math.floor(Math.random()*FLAGS_ALL.length)],text:txt});
  inp.value='';
  document.getElementById('ecm').textContent='💬 '+cards[openI].comments.length;
  rdrComments(openI);
  if(cards[openI].el)cards[openI].el.innerHTML=mkHtml(cards[openI]);
}
document.getElementById('csend').addEventListener('click',addComment);
document.getElementById('cin').addEventListener('keydown',e=>{if(e.key==='Enter')addComment();});

}

  drag.sx=x;drag.sy=y;drag.cx=cam.x;drag.cy=cam.y;
  drag.px=x;drag.py=y;drag.tgt=tgt;
  vbuf.x=[];vbuf.y=[];vel.x=0;vel.y=0;
  space.classList.add('drag');
}
function pMove(x,y){
  if(!drag.active)return;
  const ddx=x-drag.px,ddy=y-drag.py;drag.px=x;drag.py=y;
  if(Math.abs(x-drag.sx)>5||Math.abs(y-drag.sy)>5)drag.moved=true;
  if(!drag.moved)return;
  vbuf.x.push(-ddx);if(vbuf.x.length>5)vbuf.x.shift();
  vbuf.y.push(-ddy);if(vbuf.y.length>5)vbuf.y.shift();
  vel.x=vbuf.x.reduce((a,b)=>a+b,0)/vbuf.x.length;
  vel.y=vbuf.y.reduce((a,b)=>a+b,0)/vbuf.y.length;
  cam.x=drag.cx-(x-drag.sx);
  cam.y=drag.cy-(y-drag.sy);
}
function pEnd(){
  drag.active=false;space.classList.remove('drag');
  vel.x*=2.6;vel.y*=2.6;
  if(!drag.moved&&drag.tgt){
    let best=-1,bestD=55;
    const tx=drag.sx,ty=drag.sy;
    for(let i=0;i<cards.length;i++){
      const c=cards[i];
      const d=Math.hypot(c.sx-tx+CW*c.scale/2,c.sy-ty+55*c.scale);
      if(d<bestD){bestD=d;best=i;}
    }
    const ci=getCI(drag.tgt);
    if(ci!==-1)openCard(ci);
    else if(best!==-1)openCard(best);
  }
  setTimeout(()=>{drag.moved=false;drag.tgt=null;},15);
}
space.addEventListener('pointerdown',e=>{pStart(e.clientX,e.clientY,e.target);});
window.addEventListener('pointermove',e=>{if(drag.active)pMove(e.clientX,e.clientY);});
window.addEventListener('pointerup',pEnd);
document.getElementById('bar').addEventListener('pointerdown',e=>e.stopPropagation());

let nid=9000;

// ── BACKEND API ──────────────────────────────────────────────────────────────
// Flask serves BOTH the HTML and the API → routes are relative (no localhost URL)
const API='';

// Spawns one card on the canvas — called by post() AND loadRealCards()
function spawnCard(t){
  const camXnow=((cam.x%WW)+WW)%WW;
  const camYnow=((cam.y%WH)+WH)%WH;
  const newPhase=Math.random()*Math.PI*2;
  const ang=Math.random()*Math.PI*2, spd=0.04+Math.random()*.06;
  const c={
    flag:t.flag, id:String(t.id||nid++), text:t.text,
    likes:t.likes||0, liked:false, saved:false, comments:t.comments||[],
    wx:(camXnow+vw()/2-CW/2+(Math.random()-.5)*120+WW)%WW,
    wy:(camYnow+vh()-220+WH)%WH,
    vx:Math.cos(ang)*spd, vy:-0.06,
    phase:newPhase, phaseSpd:0.0013+Math.random()*.0006,
    el:null, sx:0, sy:0,
  };
  cards.push(c);
  const el=document.createElement('div');
  el.className='card'; el.innerHTML=mkHtml(c);
  space.appendChild(el); c.el=el;
  const sc=0.70+((Math.sin(newPhase)+1)*0.5)**0.32*0.30;
  const cx2=((cam.x%WW)+WW)%WW, cy2=((cam.y%WH)+WH)%WH;
  let isx=c.wx-cx2; if(isx>WW/2)isx-=WW; if(isx<-WW/2)isx+=WW;
  let isy=c.wy-cy2; if(isy>WH/2)isy-=WH; if(isy<-WH/2)isy+=WH;
  el.style.transform=`translate(${isx}px,${isy}px) scale(${sc*.1})`;
  el.style.opacity='0';
  el.style.transition='transform .52s cubic-bezier(.16,1,.3,1),opacity .38s ease';
  el.style.zIndex=Math.round(sc*25);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.opacity=(0.65+sc*.35).toFixed(2);
    el.style.transform=`translate(${isx}px,${isy}px) scale(${sc})`;
    setTimeout(()=>{if(el)el.style.transition='';},560);
  }));
}

// Send card text+flag to Python → returns the saved card with real database id
async function saveCard(text,flag){
  try{
    const res=await fetch(`${API}/cards`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,flag})
    });
    if(!res.ok)return null;
    return await res.json();
  }catch(e){
    console.log('backend offline — card saved locally only');
    return null;
  }
}

// On startup: fetch all real cards from SQLite via Python and put them on canvas
async function loadRealCards(){
  try{
    const res=await fetch(`${API}/cards`);
    const rows=await res.json();
    rows.forEach(d=>spawnCard({
      id:String(d.id), flag:d.flag, text:d.text,
      likes:d.likes||0, comments:[]
    }));
    console.log(`✦ loaded ${rows.length} real cards from database`);
  }catch(e){
    console.log('backend offline — showing seed cards only');
  }
}

// Post: save to Python first → get real id → spawn on canvas
async function post(){
  const text=document.getElementById('tin').value.trim();
  if(!text)return;
  document.getElementById('tin').value='';
  const flag=FLAGS_ALL[Math.floor(Math.random()*FLAGS_ALL.length)];
  const saved=await saveCard(text,flag);
  spawnCard({
    id: saved?String(saved.id):String(nid++),
    flag, text, likes:0, comments:[]
  });
}
document.getElementById('dbt').addEventListener('click',post);
document.getElementById('tin').addEventListener('keydown',e=>{if(e.key==='Enter')post();});

let prevCam={...cam};
function loop(){
  requestAnimationFrame(loop);
  const w=vw(),h=vh();
  if(!drag.active){
    vel.x*=FRICTION;vel.y*=FRICTION;
    if(Math.abs(vel.x)<.015)vel.x=0;
    if(Math.abs(vel.y)<.015)vel.y=0;
    cam.x+=vel.x;cam.y+=vel.y;
  }
  const dcx=cam.x-prevCam.x, dcy=cam.y-prevCam.y;
  prevCam.x=cam.x;prevCam.y=cam.y;

  ctx.clearRect(0,0,w,h);
  const g=ctx.createRadialGradient(w/2,h*.42,0,w/2,h*.42,w*.9);
  g.addColorStop(0,'rgba(16,32,145,.07)');g.addColorStop(.55,'rgba(7,7,58,.03)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(const s of stars){
    s.ph+=s.ps;
    s.sx=((s.sx+s.dx-dcx*s.par)%w+w)%w;
    s.sy=((s.sy+s.dy-dcy*s.par)%h+h)%h;
    const a=s.ba*(.5+.5*Math.sin(s.ph));
    ctx.beginPath();ctx.arc(s.sx,s.sy,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(182,202,255,${a})`;ctx.fill();
  }

  // Pre-compute toroidal camera once per frame (used by all cards)
  const camX=((cam.x%WW)+WW)%WW;
  const camY=((cam.y%WH)+WH)%WH;

  for(let i=0;i<cards.length;i++){
    if(i===openI)continue;
    const c=cards[i];

    // ── SMOOTH OSCILLATION ──────────────────────────────────────────────────────
    // Phase grows forever in radians. sin() creates smooth 0→1→0→1 wave.
    // Power <1 stretches time near peak (card lingers at full size before shrinking).
    c.phase+=c.phaseSpd;
    const t_raw=(Math.sin(c.phase)+1)*0.5;   // 0.0 → 1.0 → 0.0 smooth
    const t=Math.pow(t_raw,0.32);             // linger at top: 0.32 < 1 → stretches peak
    const scale=0.70+0.30*t;                  // 0.70 → 1.00 → 0.70
    const opacity=0.60+0.40*t;                // 0.60 → 1.00 → 0.60
    const zIdx=Math.round(t*25);
    c.scale=scale;

    // ── TOROIDAL DRIFT (no bounce — cards wrap to opposite edge) ────────────────
    const driftSpeed=0.6+t*0.7;
    c.wx=(c.wx+c.vx*driftSpeed+WW)%WW;
    c.wy=(c.wy+c.vy*driftSpeed+WH)%WH;

    // ── TOROIDAL SCREEN POSITION ────────────────────────────────────────────────
    // Camera also wraps: pick the nearest "copy" of the card (shortest path).
    // When card exits right edge it instantly appears from left, seamlessly.
    let sx=c.wx-camX;
    let sy=c.wy-camY;
    if(sx>WW/2)sx-=WW;
    if(sx<-WW/2)sx+=WW;
    if(sy>WH/2)sy-=WH;
    if(sy<-WH/2)sy+=WH;
    c.sx=sx;c.sy=sy;
    const onSc=sx>-280&&sx<w+60&&sy>-280&&sy<h+60;
    if(c.el){
      if(onSc){
        c.el.style.display='block';
        c.el.style.transform=`translate(${sx}px,${sy}px) scale(${scale})`;
        c.el.style.opacity=opacity.toFixed(2);
        c.el.style.zIndex=zIdx;
        c.el.style.pointerEvents=openI===null?'auto':'none';
      } else {
        c.el.style.display='none';
      }
    }
  }
}

initCanvas();initStars();loop();
loadRealCards(); // fetch real posted cards from Python on startup
window.addEventListener('resize',()=>{initCanvas();initStars();});
</script>
</body>
